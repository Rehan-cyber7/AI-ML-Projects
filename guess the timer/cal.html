<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eef2f7;

}

.calculator{

    width:340px;
    background:#fff;
    padding:20px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);

}

.display{

    width:100%;
    height:70px;

    border:none;
    outline:none;

    background:#f7f7f7;

    border-radius:12px;

    padding:15px;

    text-align:right;

    font-size:32px;

    margin-bottom:20px;

    color:#333;

}

.buttons{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:12px;

}

button{

    height:60px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:20px;

    transition:.2s;

}

button:hover{

    transform:scale(.97);

}

button:active{

    transform:scale(.92);

}

.number{

    background:#f4f6f8;

}

.operator{

    background:#5B9BD5;

    color:white;

    font-weight:bold;

}

.clear{

    background:#ff4d4d;

    color:white;

}

.delete{

    background:#ff9f43;

    color:white;

}

.equal{

    grid-column:span 2;

    background:#2ecc71;

    color:white;

    font-size:24px;

}

</style>

</head>

<body>

<div class="calculator">

<input
id="display"
class="display"
type="text"
readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">AC</button>

<button class="delete" onclick="deleteLast()">DEL</button>

<button class="operator" onclick="appendOperator('%')">%</button>

<button class="operator" onclick="appendOperator('/')">÷</button>


<button class="number" onclick="appendNumber('7')">7</button>
<button class="number" onclick="appendNumber('8')">8</button>
<button class="number" onclick="appendNumber('9')">9</button>
<button class="operator" onclick="appendOperator('*')">×</button>


<button class="number" onclick="appendNumber('4')">4</button>
<button class="number" onclick="appendNumber('5')">5</button>
<button class="number" onclick="appendNumber('6')">6</button>
<button class="operator" onclick="appendOperator('-')">−</button>


<button class="number" onclick="appendNumber('1')">1</button>
<button class="number" onclick="appendNumber('2')">2</button>
<button class="number" onclick="appendNumber('3')">3</button>
<button class="operator" onclick="appendOperator('+')">+</button>


<button class="number" onclick="appendNumber('00')">00</button>
<button class="number" onclick="appendNumber('0')">0</button>
<button class="number" onclick="appendDecimal()">.</button>

<button class="equal" onclick="calculate()">=</button>

</div>

</div>

<script>

const display=document.getElementById("display");

function appendNumber(num){

    if(display.value==="Error"){

        display.value="";

    }

    display.value+=num;

}

function appendDecimal(){

    let current=

    display.value.split(/[+\-*/%]/).pop();

    if(current.includes(".")) return;

    if(display.value==="" || /[+\-*/%]$/.test(display.value)){

        display.value+="0.";

    }

    else{

        display.value+=".";

    }

}

function appendOperator(op){

    if(display.value==="") return;

    let last=display.value.slice(-1);

    if(["+","-","*","/","%","."].includes(last)){

        display.value=

        display.value.slice(0,-1)+op;

    }

    else{

        display.value+=op;

    }

}

function clearDisplay(){

    display.value="";

}

function deleteLast(){

    display.value=

    display.value.slice(0,-1);

}

function calculate(){

    if(display.value==="") return;

    try{

        let result=eval(display.value);

        if(result===Infinity || isNaN(result)){

            display.value="Error";

        }

        else{

            display.value=result;

        }

    }

    catch{

        display.value="Error";

    }

}

document.addEventListener("keydown",function(e){

    if(!isNaN(e.key)){

        appendNumber(e.key);

    }

    else if(["+","-","*","/","%"].includes(e.key)){

        appendOperator(e.key);

    }

    else if(e.key==="."){

        appendDecimal();

    }

    else if(e.key==="Enter"){

        calculate();

    }

    else if(e.key==="Backspace"){

        deleteLast();

    }

    else if(e.key==="Escape"){

        clearDisplay();

    }

});

</script>

</body>
</html>
