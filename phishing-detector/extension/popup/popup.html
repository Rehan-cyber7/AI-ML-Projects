<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phishing Detector</title>
  <style>
    body {
      width: 260px;
      font-family: sans-serif;
      padding: 12px;
      margin: 0;
    }
    #verdict {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    #confidence-bar-track {
      background: #eee;
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    #confidence-bar-fill {
      height: 100%;
      width: 0%;
      background: #999;
    }
    #details {
      font-size: 12px;
      color: #555;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="verdict">Checking this page...</div>
  <div id="confidence-bar-track">
    <div id="confidence-bar-fill"></div>
  </div>
  <div id="details"></div>
  <script src="popup.js"></script>
</body>
</html>
