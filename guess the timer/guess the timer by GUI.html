<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GUESS THE TIMER</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0a0a0f;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --accent: #FFB627;
    --accent-dark: #CC8F00;
    --win: #00E676;
    --lose: #FF5252;
    --text: #F0F0F0;
    --muted: #777;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow: hidden;
    position: relative;
  }
  /* Animated background blobs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 500px; height: 500px;
    top: -15%; left: -10%;
    background: radial-gradient(circle, rgba(255,182,39,0.1), transparent 70%);
    animation: blobA 18s ease-in-out infinite alternate;
  }
  body::after {
    width: 400px; height: 400px;
    bottom: -10%; right: -10%;
    background: radial-gradient(circle, rgba(255,82,82,0.08), transparent 70%);
    animation: blobB 22s ease-in-out infinite alternate;
  }
  @keyframes blobA { to { transform: translate(80px, 60px) scale(1.2); } }
  @keyframes blobB { to { transform: translate(-60px, -80px) scale(0.9); } }

  /* Dot grid overlay */
  .dot-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  /* Win animation canvas */
  #winCanvas {
    position: fixed; inset: 0; z-index: 100; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
  #winCanvas.active { opacity: 1; }

  /* Screen system */
  #app {
    position: relative; z-index: 1;
    width: 100%; height: 100dvh;
    overflow: hidden;
  }
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transform: scale(0.96);
    transition: opacity 0.45s ease, transform 0.45s ease;
    gap: 24px;
  }
  .screen.active {
    opacity: 1; pointer-events: auto; transform: scale(1);
  }

  /* Title */
  .game-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.8rem, 9vw, 5.5rem);
    text-align: center;
    line-height: 1.05;
    color: #fff;
    letter-spacing: -1px;
  }
  .game-title .hl {
    background: linear-gradient(135deg, #FFB627 0%, #FF6D00 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
  }
  .subtitle {
    color: var(--muted); font-size: 1.1rem; font-weight: 600;
    margin-top: 8px; text-align: center;
  }

  /* Player count selector */
  .select-label {
    font-weight: 800; font-size: 1.1rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 2px; text-align: center;
  }
  .count-btns {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  }
  .count-btn {
    width: 56px; height: 56px; border-radius: 16px;
    border: 2px solid var(--card-border);
    background: var(--card);
    color: var(--text); font-family: 'Fredoka One', cursive;
    font-size: 1.4rem; cursor: pointer;
    transition: all 0.25s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .count-btn:hover { border-color: var(--accent); background: rgba(255,182,39,0.08); }
  .count-btn.selected {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(255,182,39,0.2), rgba(255,109,0,0.15));
    color: var(--accent); transform: scale(1.1);
    box-shadow: 0 0 20px rgba(255,182,39,0.2);
  }

  /* Player preview dots */
  .player-dots {
    display: flex; gap: 10px; justify-content: center;
    min-height: 36px; align-items: center;
  }
  .player-dot {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.75rem; color: #000;
    animation: dotPop 0.3s ease backwards;
  }
  @keyframes dotPop { from { transform: scale(0); } }

  /* Buttons */
  .primary-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem; padding: 16px 40px;
    border: none; border-radius: 16px; cursor: pointer;
    background: linear-gradient(135deg, #FFB627, #FF8F00);
    color: #000; letter-spacing: 0.5px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 20px rgba(255,182,39,0.3);
    display: flex; align-items: center; gap: 10px;
  }
  .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,182,39,0.45); }
  .primary-btn:active { transform: translateY(0); }

  .icon-btn {
    width: 48px; height: 48px; border-radius: 14px;
    border: 2px solid var(--card-border);
    background: var(--card); color: var(--muted);
    cursor: pointer; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  .welcome-actions {
    display: flex; align-items: center; gap: 16px;
  }

  /* Countdown */
  .countdown-player-name {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    text-align: center;
  }
  .countdown-number {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(6rem, 25vw, 14rem);
    color: var(--accent);
    animation: countPulse 0.5s ease;
    line-height: 1;
  }
  @keyframes countPulse {
    0% { transform: scale(1.5); opacity: 0; }
    60% { transform: scale(0.95); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Timer ring */
  .timer-wrap {
    position: relative;
    width: clamp(200px, 55vw, 340px);
    height: clamp(200px, 55vw, 340px);
  }
  .timer-ring {
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.08);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.3s;
  }
  .timer-ring.running {
    border-color: rgba(255,182,39,0.3);
  }
  .timer-ring.stopped {
    border-color: rgba(255,82,82,0.4);
  }
  .timer-sweep {
    position: absolute; inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0%, var(--player-color, var(--accent)) 8%, transparent 16%);
    opacity: 0; transition: opacity 0.3s;
    animation: sweepRotate 1.5s linear infinite;
  }
  .timer-ring.running .timer-sweep { opacity: 0.7; }
  .timer-ring.stopped .timer-sweep { opacity: 0; animation-play-state: paused; }
  @keyframes sweepRotate { to { transform: rotate(360deg); } }

  .timer-pulse-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 3px solid var(--player-color, var(--accent));
    opacity: 0; transform: scale(1);
    pointer-events: none;
  }
  .timer-pulse-ring.ping {
    animation: pulseRing 0.4s ease-out forwards;
  }
  @keyframes pulseRing {
    to { transform: scale(1.3); opacity: 0; }
  }

  .timer-inner {
    width: 60%; height: 60%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--player-color, var(--accent)), transparent);
    opacity: 0.15;
    transition: opacity 0.15s;
  }
  .timer-ring.running .timer-inner { opacity: 0.5; }
  .timer-ring.stopped .timer-inner { opacity: 0.05; }

  /* Guess screen */
  .guess-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    text-align: center;
  }
  .guess-display-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .guess-value {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(4rem, 15vw, 8rem);
    color: var(--accent);
    line-height: 1;
    min-width: 200px;
    text-align: center;
    transition: color 0.2s;
  }
  .guess-unit {
    font-weight: 700; font-size: 1rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 3px;
  }
  .guess-controls {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .guess-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 1rem; padding: 12px 20px;
    border: 2px solid var(--card-border);
    border-radius: 12px; background: var(--card);
    color: var(--text); cursor: pointer;
    transition: all 0.15s ease;
    min-width: 70px;
  }
  .guess-btn:hover { border-color: var(--accent); color: var(--accent); }
  .guess-btn:active { transform: scale(0.95); }
  .guess-btn.big {
    font-size: 1.15rem; padding: 14px 24px;
    min-width: 80px;
  }

  /* Result screen */
  .result-icon {
    width: 100px; height: 100px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.8rem; margin-bottom: 8px;
    animation: resultPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes resultPop { from { transform: scale(0) rotate(-20deg); } }
  .result-icon.win { background: rgba(0,230,118,0.15); color: var(--win); }
  .result-icon.lose { background: rgba(255,82,82,0.15); color: var(--lose); }
  .result-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 8vw, 3.5rem);
    animation: resultPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s backwards;
  }
  .result-title.win { color: var(--win); }
  .result-title.lose { color: var(--lose); }
  .result-details {
    text-align: center; font-size: 1.1rem; color: var(--muted);
    line-height: 1.8;
    animation: resultPop 0.5s ease 0.2s backwards;
  }
  .result-details strong {
    color: var(--text); font-size: 1.3rem;
    font-family: 'Fredoka One', cursive;
  }
  .result-reveal {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(3rem, 12vw, 6rem);
    color: var(--text); line-height: 1;
    margin: 8px 0;
    animation: resultPop 0.5s ease 0.15s backwards;
  }
  .result-reveal .unit { font-size: 0.3em; color: var(--muted); vertical-align: middle; margin-left: 4px; }
  .result-diff {
    font-weight: 700; font-size: 1rem;
    padding: 6px 16px; border-radius: 8px;
    display: inline-block; margin-top: 4px;
    animation: resultPop 0.5s ease 0.25s backwards;
  }
  .result-diff.close { background: rgba(255,182,39,0.15); color: var(--accent); }
  .result-diff.far { background: rgba(255,82,82,0.1); color: var(--lose); }

  /* Final results */
  .final-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 7vw, 3.5rem);
    background: linear-gradient(135deg, #FFB627, #FF6D00);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .final-list {
    display: flex; flex-direction: column; gap: 10px;
    width: 100%; max-width: 400px;
  }
  .final-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--card-border);
    animation: slideUp 0.4s ease backwards;
  }
  .final-row.winner {
    border-color: rgba(0,230,118,0.3);
    background: rgba(0,230,118,0.06);
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } }
  .final-dot {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.85rem; color: #000; flex-shrink: 0;
  }
  .final-name { flex: 1; font-weight: 700; font-size: 1.05rem; }
  .final-badge {
    font-family: 'Fredoka One', cursive;
    font-size: 0.85rem; padding: 4px 14px; border-radius: 8px;
  }
  .final-badge.win { background: rgba(0,230,118,0.15); color: var(--win); }
  .final-badge.lose { background: rgba(255,82,82,0.1); color: var(--lose); }
  .final-time { font-size: 0.85rem; color: var(--muted); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-card {
    background: #16161e; border: 1px solid var(--card-border);
    border-radius: 20px; padding: 28px;
    width: 100%; max-width: 460px;
    transform: translateY(20px); transition: transform 0.3s ease;
  }
  .modal-overlay.open .modal-card { transform: translateY(0); }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .modal-header h3 {
    font-family: 'Fredoka One', cursive; font-size: 1.3rem;
  }
  .sound-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--card-border);
  }
  .sound-row:last-child { border-bottom: none; }
  .sound-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; flex-shrink: 0;
  }
  .sound-icon.tick { background: rgba(255,182,39,0.15); color: var(--accent); }
  .sound-icon.stop { background: rgba(255,109,0,0.15); color: #FF6D00; }
  .sound-icon.win { background: rgba(0,230,118,0.15); color: var(--win); }
  .sound-icon.lose { background: rgba(255,82,82,0.15); color: var(--lose); }
  .sound-info { flex: 1; }
  .sound-info .name { font-weight: 700; font-size: 0.95rem; }
  .sound-info .status { font-size: 0.8rem; color: var(--muted); }
  .sound-info .status.custom { color: var(--win); }
  .sound-btns { display: flex; gap: 6px; }
  .snd-btn {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--card-border); background: var(--card);
    color: var(--muted); cursor: pointer; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .snd-btn:hover { border-color: var(--accent); color: var(--accent); }
  .snd-btn.has-custom { border-color: var(--win); color: var(--win); }
  .snd-file { display: none; }

  /* Utility */
  .mt-8 { margin-top: 8px; }
  .text-center { text-align: center; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* Mobile tweaks */
  @media (max-width: 480px) {
    .guess-btn { padding: 10px 14px; min-width: 60px; font-size: 0.9rem; }
    .guess-btn.big { padding: 12px 18px; min-width: 70px; }
    .primary-btn { padding: 14px 28px; font-size: 1.05rem; }
    .sound-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="dot-grid"></div>
<canvas id="winCanvas"></canvas>

<div id="app">
  <!-- WELCOME -->
  <section id="screen-welcome" class="screen active">
    <div>
      <h1 class="game-title">GUESS THE<br><span class="hl">TIMER</span></h1>
      <p class="subtitle">How good is your sense of time?</p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
      <p class="select-label">Number of Players</p>
      <div class="count-btns" id="countBtns"></div>
      <div class="player-dots" id="playerDots"></div>
    </div>
    <div class="welcome-actions">
      <button class="icon-btn" id="settingsBtn" aria-label="Sound Settings"><i class="fas fa-sliders-h"></i></button>
      <button class="primary-btn" id="startBtn">START GAME <i class="fas fa-play"></i></button>
    </div>
  </section>

  <!-- COUNTDOWN -->
  <section id="screen-countdown" class="screen">
    <div class="countdown-player-name" id="cdPlayerName"></div>
    <div class="countdown-number" id="cdNumber">3</div>
  </section>

  <!-- TIMER -->
  <section id="screen-timer" class="screen">
    <div class="timer-wrap">
      <div class="timer-ring" id="timerRing">
        <div class="timer-sweep"></div>
        <div class="timer-pulse-ring" id="pulseRing1"></div>
        <div class="timer-pulse-ring" id="pulseRing2"></div>
        <div class="timer-inner"></div>
      </div>
    </div>
  </section>

  <!-- GUESS -->
  <section id="screen-guess" class="screen">
    <h2 class="guess-title">What was the time?</h2>
    <div class="guess-display-wrap">
      <div class="guess-value" id="guessValue">5.0</div>
      <div class="guess-unit">seconds</div>
    </div>
    <div class="guess-controls">
      <button class="guess-btn big" data-delta="-1">-1.0</button>
      <button class="guess-btn" data-delta="-0.1">-0.1</button>
      <button class="guess-btn" data-delta="0.1">+0.1</button>
      <button class="guess-btn big" data-delta="1">+1.0</button>
    </div>
    <button class="primary-btn" id="submitGuessBtn">SUBMIT GUESS <i class="fas fa-check"></i></button>
  </section>

  <!-- RESULT -->
  <section id="screen-result" class="screen">
    <div id="resultContent" style="display:flex;flex-direction:column;align-items:center;gap:12px;"></div>
  </section>

  <!-- FINAL -->
  <section id="screen-final" class="screen">
    <h2 class="final-title">FINAL RESULTS</h2>
    <div class="final-list" id="finalList"></div>
    <button class="primary-btn" id="playAgainBtn">PLAY AGAIN <i class="fas fa-redo"></i></button>
  </section>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Sound Settings</h3>
      <button class="icon-btn" id="closeSettingsBtn" aria-label="Close"><i class="fas fa-times"></i></button>
    </div>
    <div id="soundRows"></div>
  </div>
</div>

<script>
/* ========== CONSTANTS ========== */
const PLAYER_COLORS = ['#FFB627','#FF5252','#00E676','#40C4FF','#E040FB','#FF6D00','#00BCD4','#C6FF00'];
const TOLERANCE = 0.5; // seconds
const MIN_TIME = 0.5;
const MAX_TIME = 9.5;
const SOUND_DEFS = [
  { key:'tick', label:'Tick Sound', icon:'fa-bell', cls:'tick' },
  { key:'stop', label:'Stop Sound', icon:'fa-stop', cls:'stop' },
  { key:'win',  label:'Winner Sound', icon:'fa-trophy', cls:'win' },
  { key:'lose', label:'Loser Sound', icon:'fa-times-circle', cls:'lose' },
];

/* ========== STATE ========== */
let state = {
  playerCount: 2,
  currentPlayer: 0,
  players: [],       // { name, color, result: null|'win'|'lose', guess: 0, actual: 0, diff: 0 }
  targetTime: 0,
  guessValue: 5.0,
  timerRunning: false,
};

/* ========== AUDIO ========== */
let audioCtx = null;
let customBuffers = { tick: null, stop: null, win: null, lose: null };

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playBuffer(buf) {
  if (!buf || !audioCtx) return;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start();
}

/* Default generated sounds */
function playDefaultTick() {
  if (customBuffers.tick) { playBuffer(customBuffers.tick); return; }
  ensureAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.type = 'sine'; osc.frequency.value = 880;
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  osc.start(t); osc.stop(t + 0.06);
}

function playDefaultStop() {
  if (customBuffers.stop) { playBuffer(customBuffers.stop); return; }
  ensureAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.type = 'triangle'; osc.frequency.value = 300;
  osc.frequency.linearRampToValueAtTime(150, t + 0.3);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  osc.start(t); osc.stop(t + 0.35);
}

function playDefaultWin() {
  if (customBuffers.win) { playBuffer(customBuffers.win); return; }
  ensureAudio();
  const t = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.value = f;
    const start = t + i * 0.12;
    g.gain.setValueAtTime(0.2, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
    osc.start(start); osc.stop(start + 0.3);
  });
}

function playDefaultLose() {
  if (customBuffers.lose) { playBuffer(customBuffers.lose); return; }
  ensureAudio();
  const t = audioCtx.currentTime;
  [400, 350, 280, 200].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.type = 'sawtooth'; osc.frequency.value = f;
    const start = t + i * 0.18;
    g.gain.setValueAtTime(0.1, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + 0.25);
    osc.start(start); osc.stop(start + 0.25);
  });
}

function playSound(key) {
  const map = { tick: playDefaultTick, stop: playDefaultStop, win: playDefaultWin, lose: playDefaultLose };
  if (map[key]) map[key]();
}

/* ========== SCREEN MANAGEMENT ========== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  setTimeout(() => {
    document.getElementById('screen-' + id).classList.add('active');
  }, 50);
}

/* ========== WELCOME SCREEN ========== */
function buildWelcome() {
  const btnsEl = document.getElementById('countBtns');
  btnsEl.innerHTML = '';
  for (let i = 1; i <= 8; i++) {
    const btn = document.createElement('button');
    btn.className = 'count-btn' + (i === state.playerCount ? ' selected' : '');
    btn.textContent = i;
    btn.setAttribute('aria-label', i + ' players');
    btn.addEventListener('click', () => {
      state.playerCount = i;
      buildWelcome();
    });
    btnsEl.appendChild(btn);
  }
  const dotsEl = document.getElementById('playerDots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < state.playerCount; i++) {
    const dot = document.createElement('div');
    dot.className = 'player-dot';
    dot.style.background = PLAYER_COLORS[i];
    dot.style.animationDelay = (i * 0.05) + 's';
    dot.textContent = i + 1;
    dotsEl.appendChild(dot);
  }
}

/* ========== GAME FLOW ========== */
function startGame() {
  ensureAudio();
  state.players = [];
  for (let i = 0; i < state.playerCount; i++) {
    state.players.push({
      name: 'Player ' + (i + 1),
      color: PLAYER_COLORS[i],
      result: null, guess: 0, actual: 0, diff: 0
    });
  }
  state.currentPlayer = 0;
  startRound();
}

function startRound() {
  const p = state.players[state.currentPlayer];
  // Set player color on timer ring
  document.getElementById('timerRing').style.setProperty('--player-color', p.color);
  // Show countdown
  document.getElementById('cdPlayerName').innerHTML =
    `<span style="color:${p.color}">${p.name}</span>'s Turn`;
  document.getElementById('cdNumber').textContent = '3';
  showScreen('countdown');
  let count = 3;
  const cdInterval = setInterval(() => {
    count--;
    if (count > 0) {
      const el = document.getElementById('cdNumber');
      el.textContent = count;
      el.style.animation = 'none';
      void el.offsetWidth; // reflow
      el.style.animation = 'countPulse 0.5s ease';
    } else {
      clearInterval(cdInterval);
      runTimer();
    }
  }, 800);
}

/* ========== TIMER ========== */
let tickTimeout = null;
let timerStopTimeout = null;
let pulseToggle = 0;

function runTimer() {
  showScreen('timer');
  const ring = document.getElementById('timerRing');
  ring.classList.remove('stopped');
  // Small delay before starting
  setTimeout(() => {
    state.timerRunning = true;
    state.targetTime = Math.round((MIN_TIME + Math.random() * (MAX_TIME - MIN_TIME)) * 10) / 10;
    ring.classList.add('running');
    scheduleTick();
    timerStopTimeout = setTimeout(() => stopTimer(), state.targetTime * 1000);
  }, 400);
}

function scheduleTick() {
  if (!state.timerRunning) return;
  const interval = 300 + Math.random() * 400; // 0.3-0.7s random
  tickTimeout = setTimeout(() => {
    playSound('tick');
    triggerPulse();
    if (state.timerRunning) scheduleTick();
  }, interval);
}

function triggerPulse() {
  const ring1 = document.getElementById('pulseRing1');
  const ring2 = document.getElementById('pulseRing2');
  const el = pulseToggle === 0 ? ring1 : ring2;
  el.classList.remove('ping');
  void el.offsetWidth;
  el.classList.add('ping');
  pulseToggle = 1 - pulseToggle;
}

function stopTimer() {
  state.timerRunning = false;
  clearTimeout(tickTimeout);
  const ring = document.getElementById('timerRing');
  ring.classList.remove('running');
  ring.classList.add('stopped');
  playSound('stop');
  // Wait a beat, then show guess screen
  setTimeout(() => {
    state.guessValue = 5.0;
    updateGuessDisplay();
    showScreen('guess');
  }, 600);
}

/* ========== GUESS ========== */
function adjustGuess(delta) {
  state.guessValue = Math.round(Math.max(0, Math.min(10, state.guessValue + delta)) * 10) / 10;
  updateGuessDisplay();
}

function updateGuessDisplay() {
  document.getElementById('guessValue').textContent = state.guessValue.toFixed(1);
}

function submitGuess() {
  ensureAudio();
  const p = state.players[state.currentPlayer];
  p.guess = state.guessValue;
  p.actual = state.targetTime;
  p.diff = Math.abs(p.guess - p.actual);
  p.result = p.diff <= TOLERANCE ? 'win' : 'lose';
  showResult(p);
}

/* ========== RESULT ========== */
function showResult(p) {
  const container = document.getElementById('resultContent');
  const isWin = p.result === 'win';
  // Reveal the actual time with a counting animation
  container.innerHTML = `
    <div class="result-icon ${isWin ? 'win' : 'lose'}">
      <i class="fas ${isWin ? 'fa-check' : 'fa-times'}"></i>
    </div>
    <div class="result-title ${isWin ? 'win' : 'lose'}">
      ${isWin ? 'CORRECT!' : 'WRONG!'}
    </div>
    <div class="result-reveal" id="revealTime">0.0<span class="unit">s</span></div>
    <div class="result-details">
      ${isWin
        ? `<span style="color:${p.color}">${p.name}</span> guessed <strong>${p.guess.toFixed(1)}s</strong>`
        : `<span style="color:${p.color}">${p.name}</span> guessed <strong>${p.guess.toFixed(1)}s</strong>`
      }
      <br>
      ${!isWin ? `<span class="result-diff ${p.diff < 1.5 ? 'close' : 'far'}">Off by ${p.diff.toFixed(1)}s</span>` : ''}
    </div>
    <button class="primary-btn" id="nextBtn" style="margin-top:12px;">
      ${state.currentPlayer < state.players.length - 1 ? 'NEXT PLAYER' : 'SEE RESULTS'}
      <i class="fas fa-${state.currentPlayer < state.players.length - 1 ? 'arrow-right' : 'list-ol'}"></i>
    </button>
  `;
  showScreen('result');

  // Animate the time reveal
  revealTimeAnim(p.actual);

  // Play sound after a short delay
  setTimeout(() => playSound(isWin ? 'win' : 'lose'), 400);

  // Win animation
  if (isWin) {
    setTimeout(() => startWinAnimation(p.color), 300);
  }

  // Next button
  document.getElementById('nextBtn').addEventListener('click', () => {
    stopWinAnimation();
    state.currentPlayer++;
    if (state.currentPlayer < state.players.length) {
      startRound();
    } else {
      showFinalResults();
    }
  });
}

function revealTimeAnim(target) {
  const el = document.getElementById('revealTime');
  if (!el) return;
  const duration = 800;
  const steps = 25;
  const stepTime = duration / steps;
  let step = 0;
  const interval = setInterval(() => {
    step++;
    const val = Math.round((target / steps) * step * 10) / 10;
    el.innerHTML = val.toFixed(1) + '<span class="unit">s</span>';
    if (step >= steps) {
      clearInterval(interval);
      el.innerHTML = target.toFixed(1) + '<span class="unit">s</span>';
    }
  }, stepTime);
}

/* ========== WIN ANIMATION (LINES) ========== */
const winCanvas = document.getElementById('winCanvas');
const wCtx = winCanvas.getContext('2d');
let winLines = [];
let winParticles = [];
let winAnimId = null;

function resizeWinCanvas() {
  winCanvas.width = window.innerWidth;
  winCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeWinCanvas);
resizeWinCanvas();

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function startWinAnimation(baseColor) {
  winCanvas.classList.add('active');
  winLines = [];
  winParticles = [];
  const cx = winCanvas.width / 2;
  const cy = winCanvas.height / 2;
  const rgb = hexToRgb(baseColor);
  const colorVariants = [
    baseColor,
    `rgba(${Math.min(255,rgb.r+80)},${Math.min(255,rgb.g+80)},${Math.min(255,rgb.b+80)},1)`,
    `rgba(${rgb.r},${rgb.g},${rgb.b},0.6)`,
    '#ffffff',
    `rgba(${Math.min(255,rgb.r+40)},${Math.min(255,rgb.g+40)},${Math.min(255,rgb.b+40)},0.8)`,
  ];

  // Create multiple waves of lines
  for (let wave = 0; wave < 5; wave++) {
    const lineCount = 18 + Math.floor(Math.random() * 12);
    for (let i = 0; i < lineCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const maxLen = 80 + Math.random() * (wave === 0 ? 250 : 350);
      winLines.push({
        cx, cy, angle,
        length: 0, maxLen,
        width: 1 + Math.random() * 4,
        speed: 6 + Math.random() * 12,
        color: colorVariants[Math.floor(Math.random() * colorVariants.length)],
        opacity: 0.7 + Math.random() * 0.3,
        delay: wave * 180,
        started: false,
        done: false,
        fadeStart: 0.7 + Math.random() * 0.2,
      });
    }
  }

  // Sparkle particles
  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 300;
    winParticles.push({
      cx, cy,
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2 - 1,
      size: 1.5 + Math.random() * 3,
      color: colorVariants[Math.floor(Math.random() * colorVariants.length)],
      opacity: 0.5 + Math.random() * 0.5,
      life: 1,
      decay: 0.005 + Math.random() * 0.01,
      delay: Math.random() * 600,
    });
  }

  const startTime = performance.now();
  function animate(now) {
    const elapsed = now - startTime;
    wCtx.clearRect(0, 0, winCanvas.width, winCanvas.height);

    // Draw lines
    winLines.forEach(l => {
      if (elapsed < l.delay) return;
      if (!l.started) l.started = true;
      if (l.done) return;

      l.length = Math.min(l.length + l.speed, l.maxLen);
      const progress = l.length / l.maxLen;
      const alpha = progress > l.fadeStart
        ? l.opacity * (1 - (progress - l.fadeStart) / (1 - l.fadeStart))
        : l.opacity;

      if (alpha <= 0.01) { l.done = true; return; }

      const endX = l.cx + Math.cos(l.angle) * l.length;
      const endY = l.cy + Math.sin(l.angle) * l.length;

      wCtx.beginPath();
      wCtx.moveTo(l.cx, l.cy);
      wCtx.lineTo(endX, endY);
      wCtx.strokeStyle = l.color;
      wCtx.lineWidth = l.width;
      wCtx.globalAlpha = Math.max(0, alpha);
      wCtx.lineCap = 'round';
      wCtx.stroke();

      // Bright tip
      if (!l.done) {
        wCtx.beginPath();
        wCtx.arc(endX, endY, l.width * 1.2, 0, Math.PI * 2);
        wCtx.fillStyle = '#fff';
        wCtx.globalAlpha = Math.max(0, alpha * 0.8);
        wCtx.fill();
      }
    });

    // Draw particles
    wCtx.globalAlpha = 1;
    winParticles.forEach(p => {
      if (elapsed < p.delay) return;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) return;

      wCtx.beginPath();
      wCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      wCtx.fillStyle = p.color;
      wCtx.globalAlpha = Math.max(0, p.opacity * p.life);
      wCtx.fill();
    });

    wCtx.globalAlpha = 1;

    const allDone = winLines.every(l => l.done) && winParticles.every(p => p.life <= 0 || elapsed < p.delay);
    if (!allDone) {
      winAnimId = requestAnimationFrame(animate);
    } else {
      // Keep showing final frame for a moment then fade
      setTimeout(() => {
        winCanvas.classList.remove('active');
        wCtx.clearRect(0, 0, winCanvas.width, winCanvas.height);
      }, 800);
    }
  }
  winAnimId = requestAnimationFrame(animate);
}

function stopWinAnimation() {
  if (winAnimId) cancelAnimationFrame(winAnimId);
  winCanvas.classList.remove('active');
  wCtx.clearRect(0, 0, winCanvas.width, winCanvas.height);
}

/* ========== FINAL RESULTS ========== */
function showFinalResults() {
  const list = document.getElementById('finalList');
  list.innerHTML = '';
  // Sort: winners first, then by closest diff
  const sorted = [...state.players].sort((a, b) => {
    if (a.result === 'win' && b.result !== 'win') return -1;
    if (a.result !== 'win' && b.result === 'win') return 1;
    return a.diff - b.diff;
  });
  sorted.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'final-row' + (p.result === 'win' ? ' winner' : '');
    row.style.animationDelay = (i * 0.08) + 's';
    row.innerHTML = `
      <div class="final-dot" style="background:${p.color}">${p.name.slice(-1)}</div>
      <div>
        <div class="final-name" style="color:${p.color}">${p.name}</div>
        <div class="final-time">Guessed ${p.guess.toFixed(1)}s / Actual ${p.actual.toFixed(1)}s</div>
      </div>
      <div class="final-badge ${p.result}">${p.result === 'win' ? 'WIN' : 'LOSE'}</div>
    `;
    list.appendChild(row);
  });

  // If any winner, play win sound
  const hasWinner = state.players.some(p => p.result === 'win');
  if (hasWinner) {
    setTimeout(() => {
      startWinAnimation('#FFB627');
      playSound('win');
    }, 400);
  }

  showScreen('final');
}

function resetGame() {
  stopWinAnimation();
  state.currentPlayer = 0;
  state.players = [];
  state.timerRunning = false;
  clearTimeout(tickTimeout);
  clearTimeout(timerStopTimeout);
  showScreen('welcome');
}

/* ========== SOUND SETTINGS ========== */
function buildSoundSettings() {
  const container = document.getElementById('soundRows');
  container.innerHTML = '';
  SOUND_DEFS.forEach(def => {
    const row = document.createElement('div');
    row.className = 'sound-row';
    const hasCustom = !!customBuffers[def.key];
    row.innerHTML = `
      <div class="sound-icon ${def.cls}"><i class="fas ${def.icon}"></i></div>
      <div class="sound-info">
        <div class="name">${def.label}</div>
        <div class="status ${hasCustom ? 'custom' : ''}" id="status-${def.key}">
          ${hasCustom ? 'Custom sound loaded' : 'Default sound'}
        </div>
      </div>
      <div class="sound-btns">
        <input type="file" accept="audio/*" class="snd-file" id="file-${def.key}">
        <button class="snd-btn ${hasCustom ? 'has-custom' : ''}" id="upload-${def.key}" title="Upload" aria-label="Upload ${def.label}">
          <i class="fas fa-upload"></i>
        </button>
        <button class="snd-btn" id="preview-${def.key}" title="Preview" aria-label="Preview ${def.label}">
          <i class="fas fa-play"></i>
        </button>
        ${hasCustom ? `<button class="snd-btn has-custom" id="remove-${def.key}" title="Remove custom" aria-label="Remove custom ${def.label}">
          <i class="fas fa-trash"></i>
        </button>` : ''}
      </div>
    `;
    container.appendChild(row);

    // Upload button triggers file input
    document.getElementById('upload-' + def.key).addEventListener('click', () => {
      document.getElementById('file-' + def.key).click();
    });

    // File input change
    document.getElementById('file-' + def.key).addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      ensureAudio();
      const reader = new FileReader();
      reader.onload = function(ev) {
        audioCtx.decodeAudioData(ev.target.result, (buf) => {
          customBuffers[def.key] = buf;
          buildSoundSettings(); // Rebuild to update UI
        }, () => {
          alert('Could not decode this audio file. Try another format.');
        });
      };
      reader.readAsArrayBuffer(file);
    });

    // Preview button
    document.getElementById('preview-' + def.key).addEventListener('click', () => {
      playSound(def.key);
    });

    // Remove button
    const removeBtn = document.getElementById('remove-' + def.key);
    if (removeBtn) {
      removeBtn.addEventListener('click', () => {
        customBuffers[def.key] = null;
        buildSoundSettings();
      });
    }
  });
}

/* ========== EVENT LISTENERS ========== */
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('playAgainBtn').addEventListener('click', resetGame);

document.getElementById('settingsBtn').addEventListener('click', () => {
  buildSoundSettings();
  document.getElementById('settingsModal').classList.add('open');
});
document.getElementById('closeSettingsBtn').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.remove('open');
});
document.getElementById('settingsModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById('settingsModal').classList.remove('open');
  }
});

// Guess buttons
document.querySelectorAll('.guess-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const delta = parseFloat(btn.dataset.delta);
    adjustGuess(delta);
  });
});

document.getElementById('submitGuessBtn').addEventListener('click', submitGuess);

// Keyboard support for guess
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('screen-guess').classList.contains('active')) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); adjustGuess(0.1); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); adjustGuess(-0.1); }
  if (e.key === 'Enter') { e.preventDefault(); submitGuess(); }
});

/* ========== INIT ========== */
buildWelcome();
</script>
